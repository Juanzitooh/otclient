<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">Elemental — testes de slogan e paleta</title>
  <desc id="board-desc">Comparação da paleta original com duas opções mais escuras para água e terra, todas com a frase Colete, construa, lute e viva essa aventura.</desc>
  <rect width="1800" height="1500" fill="#080A10" />
  <style>
  text { font-family: 'DejaVu Serif', serif; }
  .heading { fill:#F7F1E4; font-size:34px; letter-spacing:2px; }
  .subheading { fill:#B8B5AC; font-size:18px; }
  .row-bg { fill:#121820; stroke:#27323B; stroke-width:1; }
  .variant { fill:#E7E1D5; font-size:19px; letter-spacing:2px; }
  .values { fill:#A8B0B2; font-size:15px; }
  .tagline { fill:#E1D8C7; font-size:24px; letter-spacing:1.5px; }
</style>
  <text x="82" y="82" class="heading">TESTE DE PALETA + SLOGAN</text>
  <text x="84" y="122" class="subheading">O azul e o verde variam em intensidade; os outros tons e a forma aprovada permanecem iguais.</text>
  <text x="84" y="153" class="subheading">A frase aparece como assinatura secundária, ainda em avaliação.</text>
